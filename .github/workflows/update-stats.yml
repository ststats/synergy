name: Update all stats

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONUNBUFFERED: "1"
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Sync Supabase roster names (EloBoard API)
        continue-on-error: true
        run: python scripts/sync_members.py

      - name: Sync Supabase tier_members -> members.json (1차)
        continue-on-error: true
        run: python scripts/convert_members.py

      - name: Update data (풍고 + 엘로보드)
        run: python scripts/update_data.py

      - name: Sync Supabase tier_members -> members.json (2차)
        run: python scripts/convert_members.py

      - name: Generate pages
        run: python scripts/generate_pages.py

      - name: Subset font
        continue-on-error: true
        run: python scripts/subset_font.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          git rm -f data/members.xlsx admin.html 2>/dev/null || true

          if git diff --quiet --cached; then
            echo "변경 없음 - 커밋 생략"
            exit 0
          fi
          git commit -m "데이터 갱신 (풍고+엘로보드+Supabase): $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
