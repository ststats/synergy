name: Build Synergy web

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/templates/**'
      - 'scripts/generate_pages.py'
      - 'scripts/subset_font.py'
      - 'scripts/convert_members.py'
      - 'scripts/supabase_roster.py'
      # 새 대학 로고를 넣으면 상단 띠 색·로고 목록을 다시 만든다
      - 'assets/logos/**'

permissions:
  contents: write

concurrency:
  group: synergy-web-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONUNBUFFERED: "1"
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Export roster build cache from Supabase
        run: python scripts/convert_members.py

      - name: Generate static page shell
        run: python scripts/generate_pages.py

      - name: Write browser Supabase config
        env:
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_ANON_KEY }}
        run: python scripts/write_supabase_browser_config.py

      - name: Subset font
        continue-on-error: true
        run: python scripts/subset_font.py

      - name: Commit generated web files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi

          git commit -m "Build Synergy web"
          git pull --rebase origin main
          git push
