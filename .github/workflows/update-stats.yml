name: Build Synergy web

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/templates/**'
      - 'scripts/generate_pages.py'
      - 'scripts/subset_font.py'
      - 'scripts/convert_members.py'
      - 'scripts/supabase_roster.py'
      - 'scripts/_common.py'
      - 'scripts/write_supabase_browser_config.py'
      - 'requirements.txt'
      # 사이트 아이콘(파비콘·숲 로고) 원본
      - 'assets/logos/**'

# 빌드 결과(docs/)를 저장소에 커밋하지 않고 GitHub Pages에 바로 배포한다
# (저장소 Settings → Pages → Source: GitHub Actions). 봇 커밋이 쌓이지 않는다.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: synergy-web-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONUNBUFFERED: "1"
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Export roster build cache from Supabase
        run: python scripts/convert_members.py

      - name: Generate static page shell
        run: python scripts/generate_pages.py

      - name: Write browser Supabase config
        env:
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_ANON_KEY }}
        run: python scripts/write_supabase_browser_config.py

      - id: pages
        uses: actions/configure-pages@v6

      # 글꼴 서브셋이 실패해도 글꼴이 비지 않게, 지금 배포돼 있는 글꼴을 먼저 받아 둔다
      - name: Keep last published font
        run: |
          mkdir -p docs/fonts
          curl -fsSL "${{ steps.pages.outputs.base_url }}/fonts/PretendardVariable.woff2" -o docs/fonts/PretendardVariable.woff2 || true

      - name: Subset font
        continue-on-error: true
        run: python scripts/subset_font.py

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # 일회성: Actions 실행 기록 전부 삭제(새로 시작). 시간당 요청 한도(1000) 안에서 지우고 멈춘다. 끝나면 이 job을 뺀다.
  cleanup-old-runs:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=0
          while :; do
            left=$(gh api rate_limit --jq '.resources.core.remaining')
            [ "$left" -lt 30 ] && { echo "요청 한도 거의 다 씀($left). 한 시간 뒤 다시 돌리면 이어서 지웁니다"; break; }
            ids=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?per_page=100" --jq ".workflow_runs[] | select(.id != $GITHUB_RUN_ID and .status == \"completed\") | .id")
            [ -z "$ids" ] && { echo "남은 기록 없음"; break; }
            for id in $ids; do
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/runs/$id" >/dev/null && n=$((n+1))
              [ $((n % 50)) -eq 0 ] && echo "지운 기록 $n개"
            done
          done
          echo "이번에 지운 기록: $n개"
          echo "남은 기록: $(gh api "repos/$GITHUB_REPOSITORY/actions/runs?per_page=1" --jq '.total_count')개"
