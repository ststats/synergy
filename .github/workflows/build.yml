name: Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'templates/**'
      - 'scripts/generate_pages.py'
      - 'scripts/subset_font.py'
      - 'scripts/convert_members.py'
      - 'scripts/supabase_roster.py'
      - 'scripts/_common.py'
      - 'scripts/write_supabase_browser_config.py'
      - 'requirements.txt'
      # 사이트 아이콘(파비콘·숲 로고) 원본
      - 'assets/logos/**'

# 빌드 결과(docs/)를 저장소에 커밋하지 않고 GitHub Pages에 바로 배포한다
# (저장소 Settings → Pages → Source: GitHub Actions). 봇 커밋이 쌓이지 않는다.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: synergy-web-build
  cancel-in-progress: false

jobs:
  # 테스트(test.yml)를 먼저 돌리고, 통과해야 빌드·배포한다(정기 실행 포함).
  test:
    uses: ./.github/workflows/test.yml

  build:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONUNBUFFERED: "1"
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Export roster build cache from Supabase
        run: python scripts/convert_members.py

      - name: Generate static page shell
        run: python scripts/generate_pages.py

      - name: Write browser Supabase config
        env:
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_ANON_KEY }}
        run: python scripts/write_supabase_browser_config.py

      - id: pages
        uses: actions/configure-pages@v6

      # 글꼴 서브셋이 실패해도 글꼴이 비지 않게, 지금 배포돼 있는 글꼴을 먼저 받아 둔다
      - name: Keep last published font
        run: |
          mkdir -p docs/fonts
          curl -fsSL "${{ steps.pages.outputs.base_url }}/fonts/PretendardVariable.woff2" -o docs/fonts/PretendardVariable.woff2 || true

      - name: Subset font
        continue-on-error: true
        run: python scripts/subset_font.py

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

