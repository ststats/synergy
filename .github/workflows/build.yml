name: Build

on:
  workflow_dispatch:
  push:
    branches: [main]

# docs/는 커밋하지 않고 Pages에 바로 배포한다(Settings → Pages → Source: GitHub Actions).
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: synergy-web-build
  cancel-in-progress: false

jobs:
  scope:
    runs-on: ubuntu-24.04
    outputs:
      deploy: ${{ steps.scope.outputs.deploy }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: scope
        run: python3 scripts/build_tools/build_scope.py

  # 테스트가 통과해야 빌드·배포한다.
  test:
    uses: ./.github/workflows/test.yml

  build:
    needs: [test, scope]
    if: needs.scope.outputs.deploy == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONUNBUFFERED: "1"
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      # 공개 키(브라우저와 같은 권한). 페이지 설정과 글꼴용 선수 이름 읽기에 쓴다
      SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Generate static page shell
        run: python scripts/generate_pages.py

      - name: Write browser Supabase config
        run: python scripts/write_supabase_browser_config.py

      # 글꼴 서브셋이 docs/*.html을 읽으므로 압축을 그 전에 한다.
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Minify assets
        run: node scripts/minify_assets.mjs docs

      - id: pages
        uses: actions/configure-pages@v6

      # 서브셋이 실패해도 글꼴이 비지 않게 배포된 글꼴을 먼저 받아 둔다
      - name: Keep last published font
        run: |
          mkdir -p docs/fonts
          curl -fsSL "${{ steps.pages.outputs.base_url }}/fonts/PretendardVariable.woff2" -o docs/fonts/PretendardVariable.woff2 || true

      - name: Subset font
        continue-on-error: true
        run: python scripts/subset_font.py

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

