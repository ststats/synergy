name: Test

# python -m pytest (tests/). 사이트 배포(build.yml)와는 따로 돌아서
# 테스트가 실패해도 정기 배포를 막지 않는다 - 실패하면 Actions 탭에 빨갛게 남는다.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest -q
